[package]
name = "selai-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Selai desktop application (Tauri composition root)"

[lib]
name = "selai_desktop_lib"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
selai-domain = { version = "0.1.0", path = "../../../crates/selai-domain" }
selai-llm = { version = "0.1.0", path = "../../../crates/selai-llm" }
selai-secrets = { version = "0.1.0", path = "../../../crates/selai-secrets" }
selai-ssh = { version = "0.1.0", path = "../../../crates/selai-ssh" }
selai-storage = { version = "0.1.0", path = "../../../crates/selai-storage" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tokio = { version = "1.53.3", features = ["rt", "sync", "time", "macros", "io-util"] }
tokio-util = "0.7"

[lints]
workspace = true

[dev-dependencies]
selai-testkit = { version = "0.1.0", path = "../../../crates/selai-testkit" }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["rt-multi-thread"] }
wiremock = "0.6"
