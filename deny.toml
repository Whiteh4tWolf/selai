# cargo-deny policy: advisories, licenses, bans and sources.
# Run locally with: cargo deny check advisories licenses bans sources

[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"
# RUSTSEC-2023-0071 (Marvin): timing leak in RSA private-key operations, no
# upstream fix. RSA authentication uses the OpenSSL custom signer in
# crates/selai-ssh/src/private_key.rs, not RustCrypto RSA private operations.
# The rsa crate remains for key parsing and public signature verification.
# Revisit when a fix exists; see docs/adr/0002-ssh-transport.md.
ignore = [
  { id = "RUSTSEC-2023-0071", reason = "RSA private operations use OpenSSL; RustCrypto is limited to parsing and public verification" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "CC0-1.0",
  # Mozilla CA bundle data (webpki-root-certs), pulled by TLS verification in reqwest
  # and Tauri. A permissive data license; needed to verify provider certificates.
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[bans]
# Duplicate versions come from upstream crates (tauri, gtk bindings, russh).
# Tracked as warnings, not blocking.
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
