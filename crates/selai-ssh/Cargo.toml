[package]
name = "selai-ssh"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
russh = "0.64.1"
selai-domain = { version = "0.1.0", path = "../selai-domain" }
selai-secrets = { version = "0.1.0", path = "../selai-secrets" }
thiserror = "2"
tokio = { version = "1.53.3", features = ["rt", "net", "time", "sync", "io-util", "macros"] }
tokio-util = "0.7"

[lints]
workspace = true

[dev-dependencies]
selai-testkit = { version = "0.1.0", path = "../selai-testkit" }
tokio = { version = "1.53.3", features = ["rt-multi-thread"] }
