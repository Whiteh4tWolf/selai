name: Release packaging

# Builds the desktop installers on Linux, Windows and macOS and uploads them as
# workflow artifacts, together with SHA256SUMS and CycloneDX SBOMs. On tag
# pushes it also attests build provenance. It does not create a GitHub release,
# a tag or a PR. Artifacts are UNSIGNED unless the optional signing secrets are
# set. See docs/release/packaging.md.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  package:
    name: Installers (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    steps:
      - uses: actions/checkout@v4

      # The secrets context is not allowed in step conditions, so the presence of
      # each optional secret is stored as a boolean output. Values are never printed.
      - name: Detect optional Windows signing secret
        id: signing
        env:
          WINDOWS_CERTIFICATE_SET: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
        run: echo "windows=$WINDOWS_CERTIFICATE_SET" >> "$GITHUB_OUTPUT"

      - name: Linux system libraries for Tauri
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libdbus-1-dev \
            libsecret-1-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev \
            openssh-server gnome-keyring
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      # `-- --locked` passes --locked to cargo.
      # Linux builds deb and AppImage only. rpm is left out.
      - name: Build installers (Linux)
        if: matrix.platform == 'linux'
        working-directory: apps/desktop
        run: >-
          pnpm tauri build --ci
          --bundles deb appimage
          -- --locked

      - name: Build installers (Windows)
        if: matrix.platform == 'windows'
        working-directory: apps/desktop
        run: >-
          pnpm tauri build --ci
          -- --locked

      # Optional Apple signing and notarization. Tauri reads these variables itself.
      # A variable whose secret is empty is unset, because Tauri treats an empty
      # string as configured and would then try to use it.
      - name: Build installers (macOS)
        if: matrix.platform == 'macos'
        working-directory: apps/desktop
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                   APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!v}" ]]; then unset "$v"; fi
          done
          pnpm tauri build --ci \
            -- --locked

      - name: Sign Windows installers (only when WINDOWS_CERTIFICATE is set)
        if: matrix.platform == 'windows' && steps.signing.outputs.windows == 'true'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: >-
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/release/sign-windows.ps1
          -BundleDir target/release/bundle

      - name: Stage installers and write SHA256SUMS (Linux and macOS)
        if: matrix.platform != 'windows'
        run: bash scripts/release/collect-bundles.sh target/release/bundle stage

      - name: Stage installers and write SHA256SUMS (Windows)
        if: matrix.platform == 'windows'
        run: >-
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/release/collect-bundles.ps1
          -BundleDir target/release/bundle -StageDir stage

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.platform }}
          path: stage/
          if-no-files-found: error

  sbom:
    name: SBOM (Rust workspace and frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Pinned version. --locked keeps cargo-cyclonedx's own dependencies fixed.
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
      - name: Generate SBOMs
        run: bash scripts/release/generate-sbom.sh sbom
      - name: Upload SBOMs
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom/
          if-no-files-found: error

  attest:
    name: Build provenance attestation
    needs: [package, sbom]
    # Runs only for tag pushes. The permissions below apply to this job only.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      # Without a name, every artifact is downloaded into its own subdirectory.
      - name: Download installers and SBOMs
        uses: actions/download-artifact@v8
        with:
          path: release
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            release/installers-linux/*
            release/installers-windows/*
            release/installers-macos/*
            release/sbom/*
